<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Thai', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar สไตล์ Dashboard */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        
        .sidebar-header {
            padding: 24px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-menu {
            padding: 20px 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            border-right: 4px solid var(--primary);
        }

        /* ส่วนพื้นที่เนื้อหาหลัก */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .topbar {
            height: 70px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .topbar-title {
            font-size: 18px;
            font-weight: 600;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        /* คอนเทนเนอร์เนื้อหา */
        .content-wrapper {
            padding: 30px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        /* การ์ดการตั้งค่า */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        select, input[type="date"], input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        select:focus, input[type="date"]:focus, input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        /* เปลี่ยนสีไอคอนปฏิทินใน Chrome (Dark mode) */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .status-msg {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
            color: var(--success);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status-msg.show {
            opacity: 1;
        }
        .status-msg.error {
            color: var(--danger);
        }

        /* สำหรับซ่อน/แสดง Section */
        .section-content {
            display: none;
            width: 100%;
        }
        .section-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .content-wrapper { padding: 15px; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- แถบเมนูด้านข้าง (Sidebar) -->
    <div class="sidebar">
        <div class="sidebar-header">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            MyIoT Admin
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" id="menu-dashboard">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                แผงควบคุมระบบ
            </li>
            <li class="nav-item" id="menu-user">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                จัดการผู้ใช้งาน
            </li>
        </ul>
    </div>

    <!-- ส่วนเนื้อหาหลัก (Main Content) -->
    <div class="main-content">
        <!-- แถบด้านบน (Topbar) -->
        <div class="topbar">
            <div class="topbar-title" id="topbar-title">Dashboard / การตั้งค่าสิทธิ์การใช้งาน</div>
            <div class="admin-profile">
                <span>Super Admin</span>
                <div class="avatar">A</div>
            </div>
        </div>

        <!-- พื้นที่แสดงข้อมูล -->
        <div class="content-wrapper">
            
            <!-- ================= Section: แผงควบคุมระบบ ================= -->
            <div id="section-dashboard" class="section-content active">
                <div class="card">
                    <div class="card-header">
                        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        ตั้งค่าสถานะและวันหมดอายุ (Blynk)
                    </div>

                    <div class="form-group">
                        <label for="statusSelect">สถานะระบบ (V1)</label>
                        <select id="statusSelect">
                            <option value="1">🟢 เปิดใช้งาน (Active)</option>
                            <option value="0">🔴 ระงับการใช้งาน (Inactive)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="expireDate">วันหมดอายุ (V0)</label>
                        <input type="date" id="expireDate">
                        <div class="helper-text">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                            ระบบจะแปลงปี ค.ศ. เป็น ปี พ.ศ. (DD-MM-YYYY) อัตโนมัติเมื่อบันทึก
                        </div>
                    </div>

                    <button id="saveBtn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        บันทึกการตั้งค่า
                    </button>
                    <div class="status-msg" id="msgDashboard"></div>
                </div>
            </div>

            <!-- ================= Section: จัดการผู้ใช้งาน ================= -->
            <div id="section-user" class="section-content">
                <div class="card">
                    <div class="card-header">
                        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        บัญชีผู้ใช้งานระบบ (User 1)
                    </div>

                    <div class="form-group">
                        <label for="usernameInput">ชื่อผู้ใช้งาน Username (V3)</label>
                        <input type="text" id="usernameInput" placeholder="กำลังโหลด...">
                    </div>

                    <div class="form-group">
                        <label for="passwordInput">รหัสผ่าน Password (V4)</label>
                        <input type="text" id="passwordInput" placeholder="กำลังโหลด...">
                    </div>

                    <button id="saveUserBtn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        อัปเดตบัญชีผู้ใช้งาน
                    </button>
                    <div class="status-msg" id="msgUser"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const TOKEN = "mv0IHbbPrtMdJHzR2vnlAdijTjZHnWms";

        // ================= ควบคุมการสลับเมนู (Tabs) =================
        const menuDashboard = document.getElementById('menu-dashboard');
        const menuUser = document.getElementById('menu-user');
        const sectionDashboard = document.getElementById('section-dashboard');
        const sectionUser = document.getElementById('section-user');
        const topbarTitle = document.getElementById('topbar-title');

        menuDashboard.addEventListener('click', () => {
            menuDashboard.classList.add('active');
            menuUser.classList.remove('active');
            sectionDashboard.classList.add('active');
            sectionUser.classList.remove('active');
            topbarTitle.innerText = "Dashboard / การตั้งค่าสิทธิ์การใช้งาน";
        });

        menuUser.addEventListener('click', () => {
            menuUser.classList.add('active');
            menuDashboard.classList.remove('active');
            sectionUser.classList.add('active');
            sectionDashboard.classList.remove('active');
            topbarTitle.innerText = "Dashboard / จัดการผู้ใช้งาน";
        });

        // ================= ฟังก์ชันแสดงข้อความ =================
        function showMessage(elementId, text, isError = false) {
            const msg = document.getElementById(elementId);
            msg.innerText = text;
            msg.className = isError ? "status-msg show error" : "status-msg show";
            setTimeout(() => { msg.classList.remove('show'); }, 3000);
        }

        // ================= โหลดข้อมูลทั้งหมดเมื่อเปิดเว็บ =================
        async function loadCurrentData() {
            try {
                // 1. โหลดข้อมูล Dashboard (V0, V1)
                const resV1 = await fetch(`https://sgp1.blynk.cloud/external/api/get?token=${TOKEN}&V1`);
                let status = await resV1.text();
                document.getElementById('statusSelect').value = status.replace(/[^0-9]/g, '') || "1";

                const resV0 = await fetch(`https://sgp1.blynk.cloud/external/api/get?token=${TOKEN}&V0`);
                let dateString = await resV0.text();
                dateString = dateString.replace(/[\[\]"]/g, ''); 
                
                const parts = dateString.split('-');
                if(parts.length === 3) {
                    const day = parts[0];
                    const month = parts[1];
                    const yearCE = parseInt(parts[2]) - 543;
                    document.getElementById('expireDate').value = `${yearCE}-${month}-${day}`;
                }

                // 2. โหลดข้อมูล User (V3, V4)
                const resV3 = await fetch(`https://sgp1.blynk.cloud/external/api/get?token=${TOKEN}&V3`);
                let username = await resV3.text();
                document.getElementById('usernameInput').value = username.replace(/[\[\]"]/g, '');

                const resV4 = await fetch(`https://sgp1.blynk.cloud/external/api/get?token=${TOKEN}&V4`);
                let password = await resV4.text();
                document.getElementById('passwordInput').value = password.replace(/[\[\]"]/g, '');

            } catch (err) {
                console.error("โหลดข้อมูลล้มเหลว", err);
                showMessage("msgDashboard", "โหลดข้อมูลล้มเหลว", true);
                showMessage("msgUser", "โหลดข้อมูลล้มเหลว", true);
            }
        }

        // ================= บันทึกข้อมูล Dashboard (V0, V1) =================
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveBtn');
            const originalBtnHTML = btn.innerHTML;
            
            btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> กำลังบันทึก...`;
            btn.style.pointerEvents = 'none';

            const status = document.getElementById('statusSelect').value;
            const dateVal = document.getElementById('expireDate').value; 
            
            if(!dateVal) {
                showMessage("msgDashboard", "กรุณาเลือกวันหมดอายุ", true);
                btn.innerHTML = originalBtnHTML;
                btn.style.pointerEvents = 'auto';
                return;
            }

            const [yearCE, month, day] = dateVal.split('-');
            const yearBE = parseInt(yearCE) + 543;
            const blynkDate = `${day}-${month}-${yearBE}`;

            try {
                await fetch(`https://sgp1.blynk.cloud/external/api/update?token=${TOKEN}&V0=${blynkDate}&V1=${status}`);
                showMessage("msgDashboard", `บันทึกสำเร็จ! (สถานะ: ${status === "1" ? "เปิดใช้งาน" : "ระงับ"}, หมดอายุ: ${blynkDate})`);
            } catch (err) {
                showMessage("msgDashboard", "เกิดข้อผิดพลาดในการบันทึก", true);
            }
            
            btn.innerHTML = originalBtnHTML;
            btn.style.pointerEvents = 'auto';
        });

        // ================= บันทึกข้อมูล User (V3, V4) =================
        document.getElementById('saveUserBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveUserBtn');
            const originalBtnHTML = btn.innerHTML;
            
            btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> กำลังอัปเดต...`;
            btn.style.pointerEvents = 'none';

            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;

            try {
                // แปลงข้อมูลเป็น URL Encoding เพื่อรองรับตัวอักษรพิเศษต่างๆ
                const encodedUsername = encodeURIComponent(username);
                const encodedPassword = encodeURIComponent(password);

                await fetch(`https://sgp1.blynk.cloud/external/api/update?token=${TOKEN}&V3=${encodedUsername}`);
                await fetch(`https://sgp1.blynk.cloud/external/api/update?token=${TOKEN}&V4=${encodedPassword}`);
                
                showMessage("msgUser", `อัปเดตบัญชีผู้ใช้งานสำเร็จ!`);
            } catch (err) {
                showMessage("msgUser", "เกิดข้อผิดพลาดในการอัปเดต", true);
            }
            
            btn.innerHTML = originalBtnHTML;
            btn.style.pointerEvents = 'auto';
        });

        // เริ่มโหลดข้อมูลทันที
        loadCurrentData();
    </script>
</body>
</html>
