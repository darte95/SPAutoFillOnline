<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Auto-Fill Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: rgba(20, 20, 24, 0.6);
            --surface-hover: rgba(30, 30, 35, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8f9fa;
            --text-muted: #8b8b98;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.12), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.08), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(245, 158, 11, 0.08), transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* เมนการ์ดสไตล์ Glassmorphism */
        .card {
            position: relative;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* เส้นขอบแสงด้านบนการ์ด */
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--warning), transparent);
            opacity: 0.5;
        }

        /* Overlay ตรวจสอบสิทธิ์ */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: opacity 0.3s ease;
        }
        .overlay h2 { margin-bottom: 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
        .overlay p { font-size: 14px; font-weight: 400; color: var(--text-muted); }
        
        .loader {
            width: 48px; height: 48px;
            margin-bottom: 20px;
            border-radius: 50%;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--primary);
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }
        .overlay.error .loader {
            animation: none;
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            background: radial-gradient(circle, rgba(239, 68, 68, 0.2), transparent 70%);
        }
        .overlay.error h2 { color: var(--danger); }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ส่วนหัว */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header .icon {
            width: 52px; height: 52px;
            display: grid; place-items: center;
            font-size: 24px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.05));
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }
        .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.5px; }
        .header p { font-size: 13px; color: var(--text-muted); }

        /* กล่องข้อความ */
        textarea {
            width: 100%;
            padding: 16px;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            outline: none;
            resize: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        textarea::placeholder { color: #64748b; }
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        /* แผงควบคุม */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .checkbox-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            transition: all 0.2s ease;
            user-select: none;
            flex: 1;
            min-width: 140px;
        }
        .checkbox-label:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }
        .checkbox-label:has(input:checked) {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .checkbox-label input {
            appearance: none;
            -webkit-appearance: none;
            width: 22px; height: 22px;
            margin: 0;
            cursor: pointer;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: transparent;
            display: grid; place-items: center;
            transition: all 0.2s;
        }
        .checkbox-label input:checked {
            border-color: var(--primary);
            background: var(--primary);
        }
        .checkbox-label input:checked::after {
            content: "";
            width: 6px; height: 11px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) translate(-1px, -1px);
        }

        /* ปุ่มส่งข้อความ */
        button {
            width: 100%;
            padding: 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #2563eb);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 10px 20px -10px var(--primary-glow);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(59, 130, 246, 0.6);
            filter: brightness(1.1);
        }
        button:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px -5px rgba(59, 130, 246, 0.4);
        }
        button.success {
            background: linear-gradient(135deg, var(--success), #059669);
            box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.4);
        }

        /* ประวัติการใช้งาน */
        .history-container {
            margin-top: 8px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }
        .history-title {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .history-title::before {
            content: "";
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--warning);
            box-shadow: 0 0 8px var(--warning);
        }

        .history-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-list:empty::after {
            content: "ยังไม่มีประวัติการส่ง";
            display: block;
            padding: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transition: background 0.2s;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .history-item::before {
            content: '';
            display: block;
            width: 3px;
            height: 100%;
            background: var(--primary);
            position: absolute;
            left: 0;
            top: 0;
            border-radius: 12px 0 0 12px;
            opacity: 0.8;
        }
        .history-item { position: relative; overflow: hidden; }
        
        /* สลับสีขอบซ้าย */
        .history-item:nth-child(3n+1)::before { background: var(--primary); }
        .history-item:nth-child(3n+2)::before { background: var(--warning); }
        .history-item:nth-child(3n)::before { background: var(--danger); }
        
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(-10px) scale(0.98); } 
            to { opacity: 1; transform: none; } 
        }

        .history-text { 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 75%; 
            color: var(--text-main);
            font-weight: 400;
        }
        .history-time { 
            color: var(--text-muted); 
            font-size: 12px; 
            flex-shrink: 0;
            font-family: monospace;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        @media (max-width: 480px) {
            .card { padding: 24px; border-radius: 20px; }
            textarea { font-size: 16px; padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Overlay ตรวจสอบสิทธิ์ -->
        <div id="licenseOverlay" class="overlay">
            <div class="loader"></div>
            <h2>กำลังตรวจสอบสิทธิ์</h2>
            <p>กรุณารอสักครู่ ระบบกำลังเชื่อมต่อเซิร์ฟเวอร์...</p>
        </div>

        <div class="header">
            <div class="icon">💬</div>
            <div>
                <h1>สร้างโพสต์/คอมเมนต์</h1>
                <p>Facebook Auto-Fill System</p>
            </div>
        </div>

        <textarea id="fb_text" rows="3" placeholder="คุณกำลังคิดอะไรอยู่..." autofocus></textarea>

        <div class="controls">
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="auto_enter"> 
                    <span>ส่งด้วย Enter อัตโนมัติ</span>
                </label>
                <!-- ซ่อนไว้ตามโค้ดต้นฉบับ -->
                <label class="checkbox-label" style="display: none;">
                    <input type="checkbox" id="click_svg" checked> SVG Click
                </label>
            </div>
            <button id="sendBtn">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                ส่งข้อความ
            </button>
        </div>

        <div class="history-container">
            <div class="history-title">ประวัติการส่งล่าสุด</div>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // ===============================================
        // 1. ระบบตรวจสอบสิทธิ์ผ่าน BLYNK
        // ===============================================
        const BLYNK_TOKEN = "mv0IHbbPrtMdJHzR2vnlAdijTjZHnWms";

        function lockSystem(title, message) {
            const overlay = document.getElementById('licenseOverlay');
            overlay.classList.add('error');
            overlay.innerHTML = `<div class="loader"></div><h2>${title}</h2><p>${message}</p>`;
        }

        async function verifyLicense() {
            try {
                const resV1 = await fetch(`https://sgp1.blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&V1`);
                let statusStr = await resV1.text();
                const status = statusStr.replace(/[^0-9]/g, '');

                if (status === "0") {
                    lockSystem("ระงับการใช้งาน", "ระบบนี้ถูกปิดการใช้งานโดยผู้ดูแลระบบ");
                    return; 
                }

                if (status === "1") {
                    const resV0 = await fetch(`https://sgp1.blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&V0`);
                    let dateStr = await resV0.text();
                    dateStr = dateStr.replace(/[\[\]"]/g, ''); 

                    const match = dateStr.match(/(\d{2})-(\d{2})-(\d{4})/);
                    if (match) {
                        const d = parseInt(match[1]);
                        const m = parseInt(match[2]);
                        const yBE = parseInt(match[3]);
                        const yCE = yBE - 543; 

                        const expDate = new Date(yCE, m - 1, d, 23, 59, 59);
                        const now = new Date();

                        if (now > expDate) {
                            lockSystem("ระบบหมดอายุ", `ใบอนุญาตของคุณหมดอายุเมื่อวันที่ ${dateStr}`);
                            return; 
                        }
                    } else {
                        lockSystem("ข้อมูลผิดพลาด", "ไม่สามารถอ่านรูปแบบวันหมดอายุได้");
                        return;
                    }
                }

                // ผ่านเงื่อนไข Fade-out overlay
                const overlay = document.getElementById('licenseOverlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);

            } catch (err) {
                console.error(err);
                lockSystem("การเชื่อมต่อล้มเหลว", "ไม่สามารถตรวจสอบสิทธิ์กับเซิร์ฟเวอร์ได้");
            }
        }

        verifyLicense();

        // ===============================================
        // 2. ระบบ Firebase Realtime DB
        // ===============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBN8OuiMFTZ7CrSe_Psy4PSW4xSX7bPWyA",
            authDomain: "myiot-92b38.firebaseapp.com",
            databaseURL: "https://myiot-92b38-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "myiot-92b38"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function addHistoryToUI(text) {
            const list = document.getElementById('historyList');
            const li = document.createElement('li');
            li.className = 'history-item';

            const textSpan = document.createElement('span');
            textSpan.className = 'history-text';
            textSpan.textContent = text; 

            const timeSpan = document.createElement('span');
            timeSpan.className = 'history-time';
            
            // Format เวลาให้ดูดีขึ้น (HH:MM)
            const now = new Date();
            const timeString = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            timeSpan.textContent = timeString;

            li.appendChild(textSpan);
            li.appendChild(timeSpan);
            list.insertBefore(li, list.firstChild);
        }

        function sendMessage() {
            const textInput = document.getElementById('fb_text');
            const text = textInput.value.trim();
            if(!text) return;

            const btn = document.getElementById('sendBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<div class="loader" style="width: 20px; height: 20px; border-width: 2px; margin: 0;"></div> กำลังส่ง...`;
            btn.style.pointerEvents = 'none';

            const data = {
                fb_text: text,
                auto_enter: document.getElementById('auto_enter').checked,
                click_svg: document.getElementById('click_svg').checked,
                timestamp: Date.now()
            };

            set(ref(db, 'autofill'), data).then(() => {
                addHistoryToUI(text);
                textInput.value = "";
                
                // Animation ปุ่มสำเร็จ
                btn.classList.add('success');
                btn.innerHTML = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> ส่งสำเร็จ!`;
                
                setTimeout(() => { 
                    btn.classList.remove('success');
                    btn.innerHTML = originalHTML; 
                    btn.style.pointerEvents = 'auto';
                }, 1500);
            }).catch(err => {
                console.error(err);
                btn.innerHTML = `ล้มเหลว กรุณาลองใหม่`;
                setTimeout(() => { 
                    btn.innerHTML = originalHTML; 
                    btn.style.pointerEvents = 'auto';
                }, 2000);
            });
        }

        document.getElementById('fb_text').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
    </script>
</body>
</html>
