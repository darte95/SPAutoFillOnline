<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#06070b">
    <title>Auto-Fill Control</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Cpath d='M18.5 3 7.7 18h7.4l-2.2 11L24.7 13.4h-7.6L19.8 3z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://sgp1.blynk.cloud">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/ui.css">
    <style>
        .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px max(16px, env(safe-area-inset-left)); background: rgba(6, 7, 11, .75); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
        .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
        .brand .logo { width: 36px; height: 36px; flex: none; display: grid; place-items: center; font-size: 17px; border-radius: 11px; background: linear-gradient(135deg, var(--primary), #7c3aed); }
        .brand > div { min-width: 0; }
        .brand h1 { font-size: 16px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .brand small { display: block; color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
        .menu { position: relative; }
        .menu-list { position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px; padding: 6px; background: var(--surface-solid); border: 1px solid var(--line-2); border-radius: 13px; box-shadow: var(--shadow); }
        .menu-list a, .menu-list button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--text); background: none; border: 0; border-radius: 9px; text-align: left; cursor: pointer; text-decoration: none; }
        .menu-list a:hover, .menu-list button:hover { background: var(--surface-3); }
        .menu-list .danger { color: #fca5a5; }

        .layout { display: grid; gap: 16px; max-width: 1120px; margin: 0 auto; padding: 16px 16px max(32px, env(safe-area-inset-bottom)); }
        .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        @media (min-width: 960px) {
            .layout { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); padding-top: 24px; gap: 20px; }
            .col { gap: 20px; }
        }

        /* Composer */
        .composer textarea { min-height: 96px; max-height: 260px; font-size: 17px; background: rgba(0, 0, 0, .32); }
        .composer-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 12px; margin: 6px 2px 12px; }
        .composer-meta .over { color: #fca5a5; font-weight: 600; }
        .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .send-row { display: flex; gap: 10px; }
        .send-row .btn.primary { flex: 1; padding: 14px; font-size: 16px; }
        .delivery { display: flex; align-items: center; gap: 8px; min-height: 22px; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
        .delivery.ok { color: #6ee7b7; } .delivery.warn { color: #fcd34d; } .delivery.bad { color: #fca5a5; }

        /* Quick replies */
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .qr { position: relative; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 9px 14px; font: inherit; font-size: 15px; font-weight: 500; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: all .12s; -webkit-tap-highlight-color: transparent; }
        .qr:hover { border-color: rgba(59, 130, 246, .55); background: var(--primary-soft); }
        .qr:active { transform: scale(.96); }
        .qr .n { font-size: 11px; color: var(--faint); font-weight: 600; }
        .qr .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qr .del { display: none; width: 20px; height: 20px; place-items: center; margin-right: -6px; font-size: 12px; color: #fca5a5; background: var(--danger-soft); border-radius: 50%; }
        .editing .qr { border-style: dashed; }
        .editing .qr .del { display: grid; }
        .qr.sent { animation: sentPop .45s ease-out; }
        @keyframes sentPop { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, .7); border-color: var(--success); } 100% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); } }
        .qr-form { display: flex; gap: 8px; margin-top: 12px; }
        .empty { padding: 18px; text-align: center; font-size: 13.5px; color: var(--muted); background: rgba(0, 0, 0, .2); border: 1px dashed var(--line); border-radius: 12px; }

        /* Extension status */
        .ext { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; }
        .ext .big-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--faint); }
        .ext .big-dot.live { background: var(--success); box-shadow: 0 0 0 5px rgba(16, 185, 129, .18); animation: breathe 2s infinite; }
        .ext .big-dot.standby { background: var(--warning); box-shadow: 0 0 0 5px rgba(245, 158, 11, .15); }
        .ext .big-dot.idle { background: var(--primary); }
        @keyframes breathe { 50% { box-shadow: 0 0 0 9px rgba(16, 185, 129, .05); } }
        .ext .info { flex: 1; min-width: 0; }
        .ext .name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ext .meta { font-size: 12.5px; color: var(--muted); }
        .ext-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .ext-stats div { padding: 10px; text-align: center; background: rgba(0, 0, 0, .2); border-radius: 11px; }
        .ext-stats b { display: block; font-size: 18px; }
        .ext-stats span { font-size: 11.5px; color: var(--muted); }

        /* History */
        .history { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow-y: auto; margin-right: -6px; padding-right: 6px; }
        .hist { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--faint); border-radius: 12px; animation: histIn .35s cubic-bezier(.16, 1, .3, 1); }
        .hist.s-ok { border-left-color: var(--success); }
        .hist.s-warn { border-left-color: var(--warning); }
        .hist.s-bad { border-left-color: var(--danger); }
        .hist.s-sending { border-left-color: var(--primary); }
        @keyframes histIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
        .hist .body { flex: 1; min-width: 0; }
        .hist .text { font-size: 14.5px; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
        .hist .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .hist .acts { display: flex; gap: 2px; flex: none; }
        .hist .acts button { width: 32px; height: 32px; font-size: 15px; color: var(--muted); background: none; border: 0; border-radius: 8px; cursor: pointer; }
        .hist .acts button:hover { color: var(--text); background: var(--surface-3); }

        @media (max-width: 520px) {
            .brand small, #licenseBadge .lbl { display: none; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>
    <!-- ตรวจสิทธิ์: แสดงเฉพาะตอนยังไม่มีผลตรวจล่าสุด หรือสิทธิ์ใช้ไม่ได้ -->
    <div class="gate" id="gate" hidden>
        <div class="spinner"></div>
        <h2 id="gateTitle">กำลังตรวจสอบสิทธิ์</h2>
        <p id="gateMsg">กรุณารอสักครู่ ระบบกำลังเชื่อมต่อเซิร์ฟเวอร์…</p>
        <div class="actions" id="gateActions" hidden>
            <button class="btn" id="gateRetry">ลองใหม่</button>
            <button class="btn ghost" data-logout>ออกจากระบบ</button>
        </div>
    </div>

    <header class="topbar">
        <div class="brand">
            <div class="logo">⚡</div>
            <div>
                <h1>Auto-Fill Control</h1>
                <small id="userLabel">v3</small>
            </div>
        </div>
        <div class="top-actions">
            <span class="badge" id="licenseBadge" title="สิทธิ์การใช้งาน"><span class="lbl">สิทธิ์</span> <b>…</b></span>
            <div class="menu">
                <button class="btn icon-btn" id="menuBtn" aria-label="เมนู" aria-expanded="false">⋯</button>
                <div class="menu-list" id="menuList" hidden>
                    <a id="extLink" target="_blank" rel="noopener">⬇️ ดาวน์โหลด Extension v3</a>
                    <button id="keysBtn">⌨️ คีย์ลัด</button>
                    <button data-logout class="danger">⎋ ออกจากระบบ</button>
                </div>
            </div>
        </div>
    </header>

    <main class="layout">
        <section class="col">
            <div class="card composer">
                <div class="card-head">
                    <h2><span class="ico">💬</span>ส่งข้อความ</h2>
                    <span class="muted small" id="queueInfo"></span>
                </div>
                <textarea id="text" rows="3" placeholder="พิมพ์ข้อความที่จะกรอก…" autofocus></textarea>
                <div class="composer-meta"><span id="enterHint"></span><span id="count">0</span></div>
                <div class="opts">
                    <label class="tog"><input type="checkbox" id="optEnter"> กด Enter อัตโนมัติ</label>
                    <label class="tog"><input type="checkbox" id="optClick"> คลิกปุ่มส่ง</label>
                    <label class="tog"><input type="checkbox" id="optClear"> ล้างข้อความเดิมก่อนกรอก</label>
                    <label class="tog" title="ปิดไว้ = กด Enter เพื่อขึ้นบรรทัด ต้องกดปุ่มส่งเท่านั้น"><input type="checkbox" id="optEnterSend"> Enter = ส่ง</label>
                </div>
                <div class="send-row">
                    <button class="btn primary" id="sendBtn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
                        ส่งข้อความ
                    </button>
                </div>
                <div class="delivery" id="delivery">พร้อมส่ง</div>
            </div>

            <div class="card" id="quickCard">
                <div class="card-head">
                    <h2><span class="ico">⚡</span>ข้อความด่วน</h2>
                    <button class="btn ghost sm" id="qrEdit">แก้ไข</button>
                </div>
                <div class="chips" id="quick"></div>
                <form class="qr-form" id="qrForm" hidden>
                    <input type="text" id="qrInput" maxlength="300" placeholder="เพิ่มข้อความด่วน เช่น CF" autocomplete="off">
                    <button class="btn sm" type="submit">เพิ่ม</button>
                </form>
                <p class="hint">แตะเพื่อส่งทันที • คีย์ลัด <kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>9</kbd></p>
            </div>
        </section>

        <section class="col">
            <div class="card">
                <div class="card-head">
                    <h2><span class="ico">🧩</span>Extension ของคุณ</h2>
                    <button class="btn ghost sm" id="extRefresh">↻</button>
                </div>
                <div class="ext">
                    <i class="big-dot" id="extDot"></i>
                    <div class="info">
                        <div class="name" id="extName">กำลังตรวจสอบ…</div>
                        <div class="meta" id="extMeta"></div>
                    </div>
                </div>
                <div class="ext-stats">
                    <div><b id="extTabs">–</b><span>แท็บที่ใช้งาน</span></div>
                    <div><b id="extReady">–</b><span>พร้อมกรอก</span></div>
                    <div><b id="extSpeed">–</b><span>รับทุก</span></div>
                </div>
                <p class="hint" id="extHint"></p>
            </div>

            <div class="card">
                <div class="card-head">
                    <h2><span class="ico">🕘</span>ประวัติการส่ง</h2>
                    <button class="btn ghost sm" id="histClear">ล้างทั้งหมด</button>
                </div>
                <ul class="history" id="history"></ul>
            </div>
        </section>
    </main>

    <script src="assets/config.js"></script>
    <script src="assets/blynk.js"></script>
    <script src="assets/core.js"></script>
    <script src="assets/dashboard.js"></script>
</body>
</html>
