<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Thai', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 50%);
        }

        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            color: var(--primary);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-top: 16px;
            min-height: 20px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .error-msg.show {
            opacity: 1;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-icon">
            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 class="login-title">Auto Fill Online</h1>
        <p class="login-subtitle">กรุณาเข้าสู่ระบบเพื่อเข้าสู่ระบบ</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้งาน" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
            </div>

            <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
        </form>

        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script>
        const TOKEN = "mv0IHbbPrtMdJHzR2vnlAdijTjZHnWms";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            // รีเซ็ตข้อความแจ้งเตือนและปรับปุ่มเป็นสถานะกำลังโหลด
            errorMsg.classList.remove('show');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = `<div class="spinner"></div> กำลังตรวจสอบ...`;
            btn.disabled = true;

            try {
                // ดึงข้อมูล User (V3) และ Password (V4) จาก Blynk พร้อมกันเพื่อความรวดเร็ว
                const [resUser, resPass] = await Promise.all([
                    fetch(`https://sgp1.blynk.cloud/external/api/get?token=${TOKEN}&V3`),
                    fetch(`https://sgp1.blynk.cloud/external/api/get?token=${TOKEN}&V4`)
                ]);

                let fetchedUser = await resUser.text();
                let fetchedPass = await resPass.text();

                // ลบเครื่องหมายคำพูด หรือวงเล็บก้ามปูที่ Blynk อาจแนบมาด้วย (เช่น ["admin"])
                fetchedUser = fetchedUser.replace(/[\[\]"]/g, '').trim();
                fetchedPass = fetchedPass.replace(/[\[\]"]/g, '').trim();

                // ตรวจสอบความถูกต้อง
                if (usernameInput === fetchedUser && passwordInput === fetchedPass) {
                    btn.innerHTML = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> เข้าสู่ระบบสำเร็จ`;
                    btn.style.backgroundColor = "var(--success)";
                    
                    // หน่วงเวลาเล็กน้อยก่อนเปลี่ยนหน้าไปที่ dashboard.html
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    showError("Username หรือ Password ไม่ถูกต้อง");
                    resetButton(btn, originalBtnText);
                }

            } catch (err) {
                console.error("Fetch Error:", err);
                showError("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่");
                resetButton(btn, originalBtnText);
            }
        });

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = message;
            errorMsg.classList.add('show');
        }

        function resetButton(btn, originalText) {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    </script>
</body>
</html>
