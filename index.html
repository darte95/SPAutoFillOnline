<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06070b">
    <title>เข้าสู่ระบบ — Auto-Fill</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Cpath d='M18.5 3 7.7 18h7.4l-2.2 11L24.7 13.4h-7.6L19.8 3z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://sgp1.blynk.cloud">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/ui.css">
    <style>
        body { display: grid; place-items: center; padding: 24px 16px; }
        .login { width: 100%; max-width: 400px; padding: 32px 28px; }
        .logo { width: 60px; height: 60px; margin: 0 auto 18px; display: grid; place-items: center; font-size: 28px; border-radius: 18px; background: linear-gradient(135deg, var(--primary), #7c3aed); box-shadow: 0 14px 30px -12px rgba(59, 130, 246, .8); }
        h1 { text-align: center; font-size: 23px; font-weight: 700; letter-spacing: -.3px; }
        .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 26px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 18px; font-size: 14px; }
        .check { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
        .check input { width: 16px; height: 16px; accent-color: var(--primary); }
        .caps { font-size: 12px; color: var(--warning); }
        .msg { min-height: 22px; margin-top: 14px; text-align: center; font-size: 14px; font-weight: 500; color: #fca5a5; }
        .msg.info { color: var(--muted); }
        .foot { margin-top: 22px; text-align: center; font-size: 12.5px; color: var(--faint); }
        .switch-mode { display: block; margin: 14px auto 0; font: inherit; font-size: 13.5px; color: var(--primary); background: none; border: 0; cursor: pointer; }
        #pairCode { font-family: Consolas, monospace; font-size: 13px; word-break: break-all; }
        .shake { animation: shake .35s; }
        @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    </style>
</head>
<body>
    <main class="card login" id="card">
        <div class="logo">⚡</div>
        <h1>Auto-Fill Online</h1>
        <p class="sub">เข้าสู่ระบบเพื่อใช้งานแผงควบคุม</p>

        <form id="loginForm" novalidate>
            <label class="field">
                <span class="label">ชื่อผู้ใช้งาน</span>
                <input type="text" id="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
            </label>
            <label class="field">
                <span class="label">รหัสผ่าน <span class="caps" id="caps" hidden>Caps Lock เปิดอยู่</span></span>
                <span class="input-wrap">
                    <input type="password" id="password" autocomplete="current-password" required>
                    <button type="button" class="peek" id="peek" aria-label="แสดงรหัสผ่าน">👁</button>
                </span>
            </label>
            <div class="row">
                <label class="check"><input type="checkbox" id="remember" checked> จดจำการเข้าสู่ระบบ</label>
            </div>
            <button type="submit" class="btn primary block" id="loginBtn">เข้าสู่ระบบ</button>
        </form>
        <form id="pairForm" hidden>
            <label class="field">
                <span class="label">รหัสเชื่อมเครื่อง</span>
                <textarea id="pairCode" rows="3" spellcheck="false" placeholder="AF3-… (คัดลอกจากเมนู ⋯ ของแผงควบคุม หรือจาก popup ของ Extension)"></textarea>
            </label>
            <div class="row">
                <label class="check"><input type="checkbox" id="pairRemember" checked> จดจำการเข้าสู่ระบบ</label>
            </div>
            <button type="submit" class="btn primary block" id="pairBtn">เข้าสู่ระบบด้วยรหัส</button>
        </form>
        <button type="button" class="switch-mode" id="switchMode">ใช้รหัสเชื่อมเครื่องแทนรหัสผ่าน</button>
        <div class="msg" id="msg" role="alert"></div>
        <div class="foot">Auto-Fill System v3</div>
    </main>

    <script src="assets/config.js"></script>
    <script src="assets/blynk.js"></script>
    <script src="assets/core.js"></script>
    <script src="assets/login.js"></script>
</body>
</html>
